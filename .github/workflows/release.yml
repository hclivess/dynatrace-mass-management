name: Test, build, release

# Every push and pull request is tested end to end. A push to main then deploys GitHub Pages; a
# tag v* attaches the built site as a zip (with .sha256) to the GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, re-attach and redeploy (e.g. v2.0.0)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Self-test (built site against the mock Dynatrace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  release:
    name: Release
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$TAG" ] || { echo "Tag $TAG does not match package.json $VERSION"; exit 1; }
      - run: npm run build
      - name: Make sure no token is in the release
        run: |
          if grep -rEl 'dt0[cs][0-9]{2}\.[A-Z0-9]{24}' dist; then echo "A Dynatrace token is in dist/; refusing to package it."; exit 1; fi
      - name: Package the site
        run: |
          NAME="dynatrace-mass-management-${TAG#v}-web"
          mkdir -p release
          cp -r dist "release/$NAME"
          cp README.md LICENSE "release/$NAME/"
          (cd release && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          test -s "release/$NAME.zip" && test -s "release/$NAME.zip.sha256"
      - name: Attach to the release (created here if it does not exist yet)
        run: |
          awk '/^## Changes in /{f=1;next} /^## /{f=0} f' README.md > release/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release/notes.md --verify-tag || true
          gh release upload "$TAG" release/*.zip release/*.zip.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee release/assets.txt
          grep -q '\.zip$' release/assets.txt && grep -q '\.zip\.sha256$' release/assets.txt

  pages:
    name: Deploy GitHub Pages
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the hosted site gets the read-only Playground token; the release zip never carries one.
      - run: npm run build
        env:
          VITE_PLAYGROUND_TOKEN: ${{ secrets.DMM_PLAYGROUND_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
